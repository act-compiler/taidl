[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taidl"
version = "2.0.0"
description = "Tensor Accelerator ISA Definition Language"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "ACT Compiler Team"},
]
readme = "README.md"
dependencies = ["antlr4-python3-runtime==4.9.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"taidl.antlr4" = ["*.g4", "*.interp", "*.tokens"]
