[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "taidl"
version = "2.14"
description = "Tensor Accelerator ISA Definition Language"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    {name = "ACT Compiler Team"},
]
readme = "README.md"
dependencies = ["antlr4-python3-runtime==4.9.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["taidl*"]

[tool.setuptools.package-data]
"taidl.antlr4" = ["*.g4", "*.interp", "*.tokens"]

[tool.ruff]
line-length = 100
# Python files alone, not markdown code blocks
include = ["*.py"]
# The generated parser modules, never formatted or linted
extend-exclude = ["taidl/antlr4/IDLV2*.py"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
